spring:
  application:
    name: doodle_hometask
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/doodle}
    username: ${SPRING_DATASOURCE_USERNAME:doodle}
    password: ${SPRING_DATASOURCE_PASSWORD:doodle}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
