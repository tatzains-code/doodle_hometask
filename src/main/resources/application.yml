spring:
  application:
    name: doodle_hometask
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/doodle}
    username: ${SPRING_DATASOURCE_USERNAME:doodle}
    password: ${SPRING_DATASOURCE_PASSWORD:doodle}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

scheduling:
  slot:
    granularity-minutes: 15
    min-duration-minutes: 15
    max-duration-minutes: 240
    min-booking-buffer-minutes: 15
    max-horizon-days: 90
  availability:
    default-range-days: 7
    max-range-days: 90
